# ==============================================================================
# GitHub Dependabot Configuration — Automated Dependency & Security Updates
# ==============================================================================

version: 2
updates:
  # Package Ecosystem: Node.js / npm (Backend)
  - package-ecosystem: "npm"
    directory: "/backend"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    target-branch: "master"
    labels:
      - "security"
      - "dependencies"

  # Package Ecosystem: Node.js / npm (Frontend)
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    target-branch: "master"
    labels:
      - "security"
      - "dependencies"

  # Dockerfile Base Image Updates
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "security"
      - "docker"
