services:
  - type: web
    name: auctionpro-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DB_NAME
        value: auctionpro
      - key: CORS_ORIGINS
        value: "*"
